[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gesm-pc"
version = "0.1.0"
description = "General Elastic Shape Metric for Point Clouds"
requires-python = ">=3.8"
dependencies = ["torch>=1.12"]

[tool.setuptools.packages.find]
include = ["gesm_pc*"]
